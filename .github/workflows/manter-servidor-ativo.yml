# O plano gratuito do Supabase pausa o projeto após 7 dias sem uso.
# A cada 2 dias, este job chama uma função que só responde 1 (não toca em dados de pacientes).
name: Manter servidor ativo

on:
  schedule:
    - cron: '17 9 */2 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o servidor
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            'https://itydicdrdqhkfxorunvh.supabase.co/rest/v1/rpc/ronda_ping' \
            -H 'apikey: sb_publishable_ce0RqShFX96ew_EnlpouAA_-N9rtZTn' \
            -H 'Content-Type: application/json' -d '{}')
          echo "Resposta: $code"
          test "$code" = "200"
